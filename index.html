<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[w]strd. | Mahikeng</title>
<script>if(location.hash.length>1)location.replace("verify.html"+location.hash)</script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<script defer src="site.js"></script>
<style>
:root{--orange:#ff7a1f;--ink:#111;--paper:#fbf9f5;--bone:#ece5d6;--line:#e3ded2;--sans:"Montserrat","Helvetica Neue",Arial,sans-serif;--serif:"EB Garamond",Georgia,serif;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:1.2rem;line-height:1.45}
a{color:inherit}
.hero{background:var(--orange);min-height:calc(78svh - 57px);display:grid;place-items:center;text-align:center;padding:3rem 1.25rem}
.mark{font-family:var(--sans);font-weight:800;letter-spacing:.2em;padding-left:.2em;font-size:clamp(2rem,9vw,5rem);margin:0;display:inline-flex;align-items:baseline;white-space:nowrap}
.mark .br{display:inline-block}
.mark .rest{display:inline-block;overflow:hidden;max-width:8em}
.city{font-size:clamp(1.1rem,3.4vw,1.6rem);margin:.5rem 0 0}
.btns{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:2.5rem}
.btn{display:inline-block;border:1px solid var(--ink);padding:.95rem 2rem;font:800 .8rem var(--sans);letter-spacing:.16em;text-decoration:none;transition:background .3s,color .3s}
.btn:hover{background:var(--ink);color:#fff}
.sec{padding:clamp(3rem,8vw,6rem) clamp(1rem,4vw,3rem)}
.cap{font:800 .75rem var(--sans);letter-spacing:.22em;text-align:center;margin:0 0 2rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(.75rem,2vw,1.5rem);max-width:1000px;margin:0 auto}
.card{text-decoration:none;display:block}
.card .pic{background:var(--bone);aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden}
.card img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.05)}
.card h3{font:600 .8rem var(--sans);letter-spacing:.1em;margin:.9rem 0 0;text-transform:uppercase}
.card p{margin:.1rem 0 0;color:#6b675e;font-size:1rem}
.more{text-align:center;margin-top:2.5rem}
.event{border-top:1px solid var(--line);display:block;text-align:center;text-decoration:none}
.event img{width:min(100%,460px);height:auto;display:block;margin:0 auto 1.25rem}
.event .no{font:800 .75rem var(--sans);letter-spacing:.2em;color:#b8520c;margin:0}
.event h3{font:800 clamp(1.4rem,5vw,2rem) var(--sans);margin:.4rem 0 .25rem}
.event .meta{color:#6b675e;margin:0 0 1.25rem}
footer{border-top:1px solid var(--line);padding:2rem 1rem 3rem;text-align:center;font:800 .8rem var(--sans);letter-spacing:.2em}
footer a{text-decoration:none}
@media(prefers-reduced-motion:no-preference){
.mark .br{animation:settle 1.5s .2s cubic-bezier(.7,0,.2,1) both}
.mark .rest{animation:unfold 1.5s .2s cubic-bezier(.7,0,.2,1) both}
.city,.btns{animation:fade .8s 1.6s both}
@keyframes unfold{from{max-width:0;opacity:0}30%{opacity:1}to{max-width:8em;opacity:1}}
@keyframes settle{from{transform:scale(1.5)}to{transform:scale(1)}}
@keyframes fade{from{opacity:0}}
.anim .rv{opacity:0;transform:translateY(18px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.anim .rv.in{opacity:1;transform:none}}
@media(max-width:760px){
.hero{min-height:calc(100svh - 52px - 64px - env(safe-area-inset-bottom,0px))}
.btns{flex-direction:column;max-width:340px;margin-left:auto;margin-right:auto}
.btn{text-align:center;min-height:52px;padding:1.1rem 1rem}
.sec{padding:2.5rem 1rem}
.grid{gap:.75rem}
.more .btn{display:block}
}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div>
      <h1 class="mark" aria-label="[W]STRD."><span class="br" aria-hidden="true">[W]</span><span class="rest" aria-hidden="true">STRD.</span></h1>
      <p class="city">Mahikeng</p>
      <div class="btns"><a class="btn" href="shop.html">SHOP</a><a class="btn" href="world.html">[W]ORLD</a></div>
    </div>
  </section>

  <section class="sec">
    <p class="cap">THE COLLECTION</p>
    <div class="grid">
      <a class="card rv" href="shop.html"><div class="pic"><img src="img/tee-front.jpg" alt="Mandela Tee, black" loading="lazy"></div><h3>Mandela Tee</h3><p>Black</p></a>
      <a class="card rv" href="shop.html#beanie"><div class="pic"><img src="img/beanie.jpg" alt="Beanie, black" loading="lazy"></div><h3>Beanie</h3><p>Black</p></a>
    </div>
    <p class="more rv"><a class="btn" href="shop.html">DISCOVER THE COLLECTION</a></p>
  </section>

  <section class="sec event">
    <a class="rv" href="world.html#events" style="text-decoration:none;display:block">
      <img src="flyer-001.jpg" alt="Poster for 001 [w]strd land x El Forgero" loading="lazy">
      <p class="no">001</p>
      <h3>[w]strd land</h3>
      <p class="meta">Free entry</p>
      <span class="btn">SEE EVENT</span>
    </a>
  </section>
</main>
<footer><a href="verify.html">AUTHENTICATE YOUR PIECE</a></footer>
<script>
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!("IntersectionObserver" in window))return;
  document.documentElement.classList.add("anim");
  var els=document.querySelectorAll(".rv");
  var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}})},{threshold:.15});
  els.forEach(function(e,i){e.style.transitionDelay=(i%2)*0.12+"s";io.observe(e)});
})();
</script>
</body>
</html>
